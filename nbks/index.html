<!doctype html>
<notebook theme="midnight">
  <title>Reunion</title>
  <script id="2" type="text/markdown" hidden="">
    # Reunion
  </script>
  <script id="1" type="text/html">
    <!-- <img class= "rs" src="data/riverSnow/riverSnow.jpg"> -->
    <div id="field"></div>
    <div id="byline">
      <!-- <span id="bytext"><cite>Reading</cite> by John Cayley</span> -->
    </div>
  </script>
  <script id="5" type="module">
    // THE ENGINE, from GitHub through jsDelivr: the one place this page names its version (the same
    // tag as scoring-template.html; a new release is a change to this one line).
    const engine = "https://cdn.jsdelivr.net/gh/observable2/scoringthespeltair@v0.7.1";
    const { createConfig, typeCss, mount, play } = await import(`${engine}/index.js`);

    // THE CONFIG, as exported by the notebook (config.json): the engine's defaults plus the piece's
    // settings, so the notebook and this player cannot disagree. Player-only overrides go in the
    // second argument, e.g. { startPara: 2, running: false } while debugging.
    const config = createConfig(await FileAttachment("./data/config.json").json(), {});
  </script>
  <script id="4" type="text/html">
    <style>
      /* this page's look: colours override the midnight theme's, set on
      body (not :root) because the theme stylesheet is injected after 
      the template's and would win a same-specificity
      :root override. Everything below uses them. */
      body {
        --theme-background: black;
        --theme-foreground: floralwhite;
        cursor: none;
      }

      /* the type (family, size, weight, line height, ligatures, optical size) and the fade times
         (--spel-fade, --char-fade, --field-fade) come from config.json, exported by
         scoring-template.html, through the engine's typeCss: the type the spels were measured in.
         Do not set them again here. */
      ${typeCss(config, "#field")}

      #field {
        position: absolute;
        top: 7vw;
        /* centred on the extent of its spels; see centerField in scoringthespeltair */
        left: calc((100% - var(--extent-w, 0vw)) / 2 - var(--extent-x, 0vw));
        user-select: none;
        -webkit-user-select: none; /* Safari */
        transition: opacity var(--field-fade) ease-in-out;
      }

      #byline {
        color: var(--theme-foreground);
        font-size: 1.6vw;
        line-height: 1.1;
        padding: 0 10vw 2vw;
        text-align: center;
        z-index: 10;
        cursor: pointer;
        opacity: 0;
        transition: opacity .7s ease-in-out;
      }

      #byline:hover {
        opacity: 1;
      }

      #byline a {
        color: var(--theme-foreground);
        text-decoration: none;
      }

      #byline a:hover {
        color: lightgray;
      }

      .char {
        opacity: 0;
        transition: all var(--char-fade) ease-in-out;
      }

      .char.visible {
        opacity: 1;
      }

      .spel {
        position: absolute;
        opacity: 0;
        transition: all var(--spel-fade) ease-in-out;
      }

      .spel.visible {
        opacity: 1;
      }
    </style>
  </script>
  <script id="3" type="module">
    // Wait for the DOM to be ready before querying elements
    await new Promise(resolve => requestAnimationFrame(resolve));

    const byline = document.getElementById("byline");
    if (byline) byline.style.opacity = 0; // change to 1 to show the byline
    else console.log("WARNING: #byline element not found");

    const fieldElem = document.getElementById("field");

    // THE DATA exported by the notebook (see "Export" in scoring-template.html), from nbks/data/
    const spels = new Map(await FileAttachment("./data/spels.json").json()); // id -> spel
    const paras = await FileAttachment("./data/paras.json").json();   // spel ids, by paragraph
    const scores = await FileAttachment("./data/scores-timeToRead.json").json(); // [{ id, duration }, ...] by paragraph
    const measuredWith = await FileAttachment("./data/measured.json").json(); // the type the spels were measured at

    // Puts the spels in the field (split into characters if config.charFades), centres the field, and
    // warns in the console if the type here differs from the type the spels were measured in.
    mount(config, fieldElem, { spels, measuredWith });

    if (config.running) play(config, fieldElem, spels, paras, scores);
  </script>
</notebook>
